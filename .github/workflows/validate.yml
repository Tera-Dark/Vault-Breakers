name: Validate sources and place
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts --ignore-scripts
      - run: npm test --prefix scripts
      - run: python3 scripts/build-place.py --check
      - run: python3 scripts/generate-audio.py --check
